spring:
  datasource:
    url: jdbc:h2:mem:conferedb;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL:false}
    listener:
      simple:
        auto-startup: ${RABBITMQ_AUTO_STARTUP:false}

management:
  health:
    rabbit:
      enabled: ${RABBITMQ_AUTO_STARTUP:false}

confere:
  jwt:
    secret: ${JWT_SECRET:confere-dev-secret-key-com-no-minimo-32-bytes-seguros}
